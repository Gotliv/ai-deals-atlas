name: Validate research and application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_data.py
      - run: node --check public/app.js
      - run: python3 scripts/validate_data.py
      - run: git diff --exit-code public/data/atlas.json
